<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaMind AI - العقل الذكي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #030712;
            --accent-blue: #00f0ff;
            --accent-glow: #0077ff;
            --glass-bg: rgba(13, 20, 36, 0.65);
            --glass-border: rgba(0, 240, 255, 0.25);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 15px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            top: -100px;
            right: -100px;
            filter: blur(80px);
            opacity: 0.35;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, var(--accent-blue) 0%, transparent 70%);
            bottom: -80px;
            left: -80px;
            filter: blur(80px);
            opacity: 0.25;
            z-index: 0;
        }

        .main-container {
            width: 100%;
            max-width: 550px;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 30px 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .header-title {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand-logo {
            font-size: 2.2rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff 30%, var(--accent-blue) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
            text-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
        }

        .brand-subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 4px;
            font-weight: 300;
        }

        .input-group {
            position: relative;
            margin-bottom: 18px;
        }

        .input-label {
            display: block;
            font-size: 0.85rem;
            color: var(--accent-blue);
            margin-bottom: 8px;
            font-weight: 700;
            padding-right: 4px;
        }

        .custom-input {
            width: 100%;
            padding: 16px 20px;
            background: rgba(3, 7, 18, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        .custom-input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.25), inset 0 2px 4px rgba(0,0,0,0.5);
        }

        .btn-generate {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #0052d4, #0077ff, #00f0ff);
            background-size: 200% 200%;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 10px 25px rgba(0, 119, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-generate:hover {
            background-position: right center;
            box-shadow: 0 12px 30px rgba(0, 240, 255, 0.6);
            transform: translateY(-2px);
        }

        .btn-generate:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .output-card {
            display: none;
            position: relative;
            animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .output-title {
            font-size: 0.9rem;
            color: var(--accent-blue);
            font-weight: 700;
        }

        .btn-copy {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .output-content {
            font-size: 1rem;
            line-height: 1.8;
            color: #e2e8f0;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }

        .pulse-loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="glass-card">
        <div class="header-title">
            <div class="brand-logo">NovaMind AI</div>
            <div class="brand-subtitle">جيل جديد من التوليد الذكي السريع</div>
        </div>

        <div class="input-group">
            <label class="input-label" for="topic">عن ماذا تريد البحث أو الكتابة؟</label>
            <input type="text" id="topic" class="custom-input" placeholder="مثال: أفكار تسويق، الذكاء الاصطناعي، نصائح..." autocomplete="off">
        </div>

        <button id="btn" class="btn-generate" onclick="generateContent()">
            <span class="pulse-loader" id="loader"></span>
            <span id="btnText">✨ ابتكر الآن</span>
        </button>
    </div>

    <div class="glass-card output-card" id="outputCard">
        <div class="output-header">
            <span class="output-title">⚡ النتيجة الذكية</span>
            <button class="btn-copy" onclick="copyText()">📋 نسخ النص</button>
        </div>
        <div class="output-content" id="output"></div>
    </div>
</div>

<script>
    async function generateContent() {
        const topic = document.getElementById('topic').value.trim();
        const btn = document.getElementById('btn');
        const loader = document.getElementById('loader');
        const btnText = document.getElementById('btnText');
        const outputCard = document.getElementById('outputCard');
        const output = document.getElementById('output');

        if(!topic) {
            document.getElementById('topic').focus();
            return;
        }

        outputCard.style.display = 'none';
        btn.disabled = true;
        loader.style.display = 'inline-block';
        btnText.innerText = 'جاري التفكير...';

        const fullPrompt = `أجب على هذا الطلب بشكل مختصر ومفيد ومباشر باللغة العربية: ${topic}`;

        try {
            const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(fullPrompt)}`);
            
            if(!response.ok) throw new Error('تعذر الاتصال بالخادم');

            const text = await response.text();
            
            if(text.includes("402") || text.includes("error")) {
                throw new Error("سيرفرات الذكاء الاصطناعي مشغولة حالياً");
            }

            output.innerText = text;
            outputCard.style.display = 'block';
            outputCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        } catch(error) {
            output.innerText = "✨ عفواً، هناك ضغط كبير على خوادم الذكاء الاصطناعي الآن. \n\nنصيحة: حاول الضغط على 'ابتكر الآن' مرة أخرى بعد ثوانٍ قليلة، أو جرب كتابة سؤال أبسط قليلاً.";
            outputCard.style.display = 'block';
        } finally {
            btn.disabled = false;
            loader.style.display = 'none';
            btnText.innerText = '✨ ابتكر الآن';
        }
    }

    function copyText() {
        const text = document.getElementById('output').innerText;
        if(text) {
            navigator.clipboard.writeText(text);
            const copyBtn = document.querySelector('.btn-copy');
            copyBtn.innerText = '✅ تم النسخ!';
            setTimeout(() => { copyBtn.innerText = '📋 نسخ النص'; }, 2000);
        }
    }
</script>

</body>
</html>
